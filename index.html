<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Presupuestos - Electricidad</title>
    <!-- FontAwesome para los íconos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- Librería Html2Pdf para descarga directa de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- CSS principal -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo-title">
            <i class="fa-solid fa-bolt"></i>
            <span>ElectroPresupuesto</span>
        </div>
        <button class="btn btn-secondary" onclick="openProfileModal()">
            <i class="fa-solid fa-user-gear"></i> Configurar Perfil
        </button>
    </header>

    <div class="app-container">
        
        <!-- PANEL DE CONTROL / FORMULARIO -->
        <div class="panel controls-panel">
            <div class="panel-title">
                <span><i class="fa-solid fa-file-signature"></i> Datos del Presupuesto</span>
            </div>

            <!-- Cliente -->
            <div class="form-group">
                <label for="clientName">Nombre del Cliente</label>
                <input type="text" id="clientName" class="form-control" placeholder="Ej: Juan Pérez" oninput="updatePreview()">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="clientPhone">Teléfono Cliente</label>
                    <input type="text" id="clientPhone" class="form-control" placeholder="Ej: 11 2345-6789" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label for="validity">Vigencia</label>
                    <select id="validity" class="form-control" onchange="updatePreview()">
                        <option value="1">24 Horas</option>
                        <option value="15" selected>15 Días</option>
                        <option value="20">20 Días</option>
                    </select>
                </div>
            </div>

            <!-- Accesos rápidos -->
            <div class="form-group">
                <label>Atajos de Trabajos Frecuentes</label>
                <div class="shortcuts">
                    <span class="chip" onclick="addShortcut('Instalación de Térmica/Diferencial', 1, 15000)">+ Térmica/Diferencial</span>
                    <span class="chip" onclick="addShortcut('Cambio de Cableado por Boca', 1, 8000)">+ Cableado p/boca</span>
                    <span class="chip" onclick="addShortcut('Colocación de Artefacto Luz', 1, 6000)">+ Artefacto Luz</span>
                    <span class="chip" onclick="addShortcut('Armado de Tablero Principal',
